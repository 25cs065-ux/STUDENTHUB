<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <h1>Student Registration Form</h1>
        <p class="description">Please fill in all the details correctly.</p>

        <form id="registrationForm" action="process_register.php" method="POST" novalidate>

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" autocomplete="name">
                <span class="error" id="nameError"></span>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="example@gmail.com" autocomplete="email">
                <span class="error" id="emailError"></span>
            </div>

            <div class="form-group">
                <label for="mobile">Mobile Number</label>
                <input type="tel" id="mobile" name="mobile" placeholder="Enter 10-digit mobile number"
                       maxlength="10" inputmode="numeric" autocomplete="tel">
                <span class="error" id="mobileError"></span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Minimum 8 characters"
                       autocomplete="new-password" aria-describedby="passwordHelp">
                <small id="passwordHelp">At least 8 characters with uppercase, lowercase, a number and a special character.</small>
                <div class="strength-container"><div id="strengthBar"></div></div>
                <p id="strengthText" class="strength-text">Password strength: Not entered</p>
                <span class="error" id="passwordError"></span>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword"
                       placeholder="Re-enter your password" autocomplete="new-password">
                <span class="error" id="confirmPasswordError"></span>
            </div>

            <div class="form-group">
                <label for="course">Course</label>
                <select id="course" name="course">
                    <option value="">-- Select Course --</option>
                    <option value="CSE">Computer Science Engineering</option>
                    <option value="IT">Information Technology</option>
                    <option value="CE">Computer Engineering</option>
                    <option value="ECE">Electronics &amp; Communication</option>
                    <option value="ME">Mechanical Engineering</option>
                </select>
                <span class="error" id="courseError"></span>
            </div>

            <div class="form-group">
                <label for="year">Year</label>
                <select id="year" name="year">
                    <option value="">-- Select Year --</option>
                    <option value="1">First Year</option>
                    <option value="2">Second Year</option>
                    <option value="3">Third Year</option>
                    <option value="4">Fourth Year</option>
                </select>
                <span class="error" id="yearError"></span>
            </div>

            <fieldset>
                <legend>Gender</legend>
                <div class="gender-options">
                    <label><input type="radio" name="gender" value="Male"> Male</label>
                    <label><input type="radio" name="gender" value="Female"> Female</label>
                    <label><input type="radio" name="gender" value="Other"> Other</label>
                </div>
                <span class="error" id="genderError"></span>
            </fieldset>

            <div class="terms">
                <label>
                    <input type="checkbox" id="terms" name="terms">
                    I agree to the Terms and Conditions.
                </label>
                <span class="error" id="termsError"></span>
            </div>

            <button type="submit">Register</button>
            <p id="successMessage" class="success" aria-live="polite"></p>
        </form>

        <p style="text-align:center;margin-top:18px;">
            Already registered? <a href="login.php">Login here</a>
        </p>
    </main>

    <script src="script.js"></script>
</body>
</html>
