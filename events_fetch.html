
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fetch API CRUD | StudentHub</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#24334a}
header{background:#fff;border-bottom:1px solid #e1e8f0;padding:22px 6%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:24px;margin:0;color:#244d76}
header p{margin:7px 0 0;color:#66758a}
main{max-width:1100px;margin:30px auto;padding:0 20px}
.panel{background:#fff;border:1px solid #e1e8f0;border-radius:14px;padding:24px;margin-bottom:22px;box-shadow:0 5px 20px #24334a08}
h2{margin-top:0;font-size:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label{display:block;font-weight:600;font-size:14px;margin-bottom:7px}
input,textarea,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;background:#fff}
textarea{min-height:95px;resize:vertical}
.full{grid-column:1/-1}
button,.link{border:0;border-radius:8px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.primary{background:#315b7d;color:white}
.secondary{background:#eaf1f8;color:#244d76}
.danger{background:#fee8e7;color:#a32828}
button:disabled{opacity:.55;cursor:wait}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
#message{padding:13px;border-radius:8px;margin-bottom:18px;display:none;white-space:pre-wrap}
#message.success{display:block;background:#e5f7ec;color:#17643a}
#message.error{display:block;background:#fff0ee;color:#a32828}
#loading{color:#52657a;padding:12px 0}
#events{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.event{border:1px solid #e0e8f0;border-radius:11px;padding:18px;min-width:0}
.event h3{margin:0 0 12px;overflow-wrap:anywhere;color:#244d76}
.event p{line-height:1.5;overflow-wrap:anywhere}
.status{display:inline-block;background:#eaf1f8;color:#315b7d;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:bold}
.empty{padding:25px;text-align:center;color:#64748b;border:1px dashed #cbd5e1;border-radius:10px}
@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}header{padding:18px 5%}.panel{padding:17px}}
</style>
</head>
<body>
<header>
<div>
<h1>StudentHub Events</h1>
<p>PHP JSON API and Fetch-based CRUD</p>
</div>
<a class="link secondary" href="events.php">Existing Event Management</a>
</header>
<main>
<div id="message" role="status" aria-live="polite"></div>
<section class="panel">
<h2 id="formTitle">Add New Event</h2>
<form id="eventForm">
<input type="hidden" id="event_id">
<div class="grid">
<div>
<label for="event_name">Event Name *</label>
<input id="event_name" maxlength="100" required>
</div>
<div>
<label for="event_date">Date and Time *</label>
<input id="event_date" type="datetime-local" required>
</div>
<div>
<label for="venue">Venue *</label>
<input id="venue" maxlength="200" required>
</div>
<div>
<label for="status">Status *</label>
<select id="status" required>
<option>Upcoming</option>
<option>Ongoing</option>
<option>Completed</option>
<option>Cancelled</option>
</select>
</div>
<div class="full">
<label for="description">Description *</label>
<textarea id="description" maxlength="5000" required></textarea>
</div>
<div class="full actions">
<button class="primary" id="saveButton" type="submit">Add Event</button>
<button class="secondary" type="button" id="cancelButton" hidden>Cancel Edit</button>
<button class="secondary" type="button" id="refreshButton">Refresh List</button>
</div>
</div>
</form>
</section>
<section class="panel">
<h2>All Events</h2>
<div id="loading" role="status">Loading events...</div>
<div id="events"></div>
</section>
</main>
<script src="practical13.js"></script>
</body>
</html>
